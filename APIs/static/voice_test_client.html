<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Voice AI Assistant — Test Client</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 20px; }
  textarea { width: 100%; height: 70px; font-size: 15px; padding: 8px; box-sizing: border-box; }
  button { font-size: 15px; padding: 10px 16px; margin: 6px 6px 6px 0; cursor: pointer; }
  #log { white-space: pre-wrap; background: #f5f5f5; padding: 12px; border-radius: 6px; min-height: 200px; font-size: 13px; }
  .row { margin-bottom: 10px; }
  input[type=text] { font-size: 14px; padding: 6px; width: 160px; }
  .status { font-weight: bold; }
</style>
</head>
<body>
  <h1>Voice AI Assistant — Test Client</h1>

  <div class="row">
    Session ID: <input type="text" id="sessionId" value="web-test-1">
    <button onclick="newSession()">New Session</button>
  </div>

  <div class="row">
    <textarea id="userText" placeholder="Type what the patient would say...">I have a bad headache and feel feverish</textarea>
  </div>

  <div class="row">
    <button onclick="sendText()">Send Text</button>
    <button onclick="interrupt()">Interrupt</button>
    <button onclick="stopAudio()">Stop Playback</button>
  </div>

  <div class="row">
    <span class="status">Status: </span><span id="status">idle</span>
  </div>

  <audio id="player" controls style="width:100%"></audio>

  <h3>Log</h3>
  <div id="log"></div>

<script>
const log = (msg) => {
  const el = document.getElementById('log');
  el.textContent += msg + "\n";
  el.scrollTop = el.scrollHeight;
};

const setStatus = (s) => document.getElementById('status').textContent = s;

function newSession() {
  document.getElementById('sessionId').value = 'web-test-' + Math.floor(Math.random() * 100000);
  log('New session: ' + document.getElementById('sessionId').value);
}

async function sendText() {
  const text = document.getElementById('userText').value.trim();
  const sessionId = document.getElementById('sessionId').value.trim();
  if (!text || !sessionId) { log('ERROR: text and session id are required'); return; }

  log('> USER: ' + text);
  setStatus('sending...');

  try {
    const res = await fetch('/voice/chat/text', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, session_id: sessionId })
    });

    if (!res.ok) {
      const errJson = await res.json().catch(() => ({}));
      log('ERROR ' + res.status + ': ' + JSON.stringify(errJson));
      setStatus('error');
      return;
    }

    const contentType = res.headers.get('Content-Type') || '';
    if (contentType.includes('application/json')) {
      const data = await res.json();
      log('< ' + JSON.stringify(data));
      setStatus(data.status || 'done');
      return;
    }

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const player = document.getElementById('player');
    player.src = url;
    player.play();
    log('< AI responded with audio (' + blob.size + ' bytes)');
    setStatus('playing');
  } catch (e) {
    log('EXCEPTION: ' + e);
    setStatus('error');
  }
}

async function interrupt() {
  const sessionId = document.getElementById('sessionId').value.trim();
  stopAudio();
  try {
    const res = await fetch('/voice/interrupt', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId })
    });
    const data = await res.json();
    log('< interrupt: ' + JSON.stringify(data));
    setStatus('interrupted');
  } catch (e) {
    log('EXCEPTION: ' + e);
  }
}

function stopAudio() {
  const player = document.getElementById('player');
  player.pause();
  player.currentTime = 0;
}
</script>
</body>
</html>
